name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # magic-nix-cache needs FlakeHub now; this one uses the plain Actions cache.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.0
      - name: ci
        run: nix develop --command just ci
      - name: nix build
        run: nix build .#hulahoop && ./result/bin/hulahoop help
      # The loop itself: the fake adapter, the real state machine, a throwaway repo.
      - name: end-to-end loop
        run: nix develop --command bash tests/e2e/loop.sh
      # The desktop shell is a separate Cargo build; compiling it here means a shell
      # bug fails on every push instead of on the next release tag.
      - name: desktop shell compiles
        if: matrix.os == 'ubuntu-latest'
        run: nix develop --command just shell-check
      - name: junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: .hulahoop/junit.xml
          if-no-files-found: ignore

  # The NixOS VM test boots QEMU, which is slow without /dev/kvm, so it has its own
  # job and timeout and cannot hide a failure in the main one.
  nixos-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: nix flake check
        run: nix flake check
