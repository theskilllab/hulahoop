name: release

on:
  push:
    tags: ["v*"]

# Three artifacts come out of here.
#
#   Hulahoop_<version>_aarch64.dmg          the desktop app, Apple silicon only
#   hulahoop-aarch64-apple-darwin.tar.gz    server + runner + cli, macOS arm64
#   hulahoop-x86_64-unknown-linux-gnu.tar.gz
#   hulahoop-aarch64-unknown-linux-gnu.tar.gz
#
# The desktop is a macOS product (Tauri + WKWebView); the host that runs the agents
# is whatever machine has nix, direnv, jj, and the agent CLIs, so it gets binaries
# for both Linux architectures and for macOS.
jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.0
      - name: bundle the app
        # The tag names the release, and the tag is what the dmg says.
        env:
          HULAHOOP_VERSION: ${{ github.ref_name }}
        run: nix develop --command just bundle aarch64-apple-darwin
      - name: pack the server, the runner, and the cli
        run: nix develop --command just headless aarch64-apple-darwin
      - name: verify the app needs nothing but macOS
        run: |
          APP=apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Hulahoop.app
          # The bundle is built inside the nix shell, so a leaked /nix/store path
          # means the app dies at launch on a machine without nix (dyld: Library
          # not loaded). Refuse to publish one.
          for bin in "$APP"/Contents/MacOS/*; do
            echo "dependencies of $bin"
            otool -L "$bin"
            ! otool -L "$bin" | grep -q "/nix/store/"
          done
          ! otool -l "$APP"/Contents/MacOS/hulahoop-desktop | grep -A2 LC_RPATH | grep -q "/nix/store/"
      - name: verify signature
        run: |
          APP=apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Hulahoop.app
          # Every executable in Contents/MacOS must be signed: on arm64 the kernel
          # refuses to launch an unsigned binary, and that includes the two sidecars.
          for bin in "$APP"/Contents/MacOS/*; do
            echo "verifying $bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
          codesign -dvv "$APP" 2>&1 | tee /tmp/codesign.txt
          grep -q "Signature=adhoc" /tmp/codesign.txt
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-aarch64
          path: |
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            dist/*.tar.gz

  headless:
    # Deliberately built with the runner's own toolchain, not the nix shell: the
    # binaries have to run on a machine without nix, and the nix stdenv's linker
    # records /nix/store paths for glibc. Ubuntu 22.04 for x86_64 keeps the glibc
    # floor at 2.35; arm64 has no older hosted image, so it needs 2.39.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - name: pack the server, the runner, and the cli
        run: bash scripts/headless.sh ${{ matrix.target }}
      - name: the binaries run without nix
        run: |
          mkdir -p /tmp/pack
          tar -xzf "dist/hulahoop-${{ matrix.target }}.tar.gz" -C /tmp/pack
          /tmp/pack/hulahoop help
          data=$(mktemp -d)
          /tmp/pack/hulahoop serve --data-dir "$data" --port 5199 &
          server=$!
          for _ in $(seq 1 50); do curl -sf http://127.0.0.1:5199/health && break; sleep 0.2; done
          kill "$server"
          ! ldd /tmp/pack/hulahoop | grep -q '/nix/store/'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    needs: [app, headless]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # upload-artifact keeps the paths it was given, so collect what the jobs
          # produced into one flat directory before publishing.
          mkdir -p release
          find artifacts -name '*.dmg' -exec cp {} release/ \;
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          ls -l release
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "Hulahoop $TAG.

          **The desktop app** (\`Hulahoop_<version>_aarch64.dmg\`) needs macOS 14 on Apple silicon. The build is unsigned: right-click the app and choose Open.

          **The host that runs the agents** takes one of the \`hulahoop-*.tar.gz\` assets — one \`hulahoop\` binary that runs the server, the runner, and the CLI. Pick the triple that matches it, unpack it there, and run \`./hulahoop up --listen 0.0.0.0 --port 9000\`. That machine needs nix, direnv, jj, and the agent CLIs; the Mac only needs the app." \
            release/*

  stable:
    # Users who follow releases take `github:theskilllab/hulahoop/stable`; this
    # moves that branch to each new tag.
    # Prerelease tags (v0.2.0-rc1) must not move the channel. The push is forced,
    # so `stable` must not have branch protection. After the first tag, check that
    # `git ls-remote origin refs/heads/stable` shows the tag's commit.
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: move stable to the tag
        run: git push --force origin "${GITHUB_SHA}:refs/heads/stable"
