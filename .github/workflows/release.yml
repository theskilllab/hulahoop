name: release

on:
  push:
    tags: ["v*"]

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel needs an x86_64 runner GitHub no longer offers by default; add a
          # `macos-26-intel` (or a paid larger runner) leg here when it matters, and
          # keep the artifact name distinct.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.0
      - name: bundle
        run: nix develop --command just bundle ${{ matrix.target }}
      # arm64 refuses to execute an unsigned binary at all, so an ad-hoc signature is
      # mandatory. Verify the executable (what the kernel checks on launch) and assert
      # the signature really is ad-hoc: `--verify --deep` on the whole bundle reports
      # "code has no resources but signature indicates they must be present" for an
      # ad-hoc signed .app, which is a codesign quirk, not a bundling defect.
      - name: verify the app needs nothing but macOS
        run: |
          APP=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Hulahoop.app
          # The bundle is built inside the nix shell, so a leaked /nix/store path
          # means the app dies at launch on a machine without nix (dyld: Library
          # not loaded). Refuse to publish one.
          for bin in "$APP"/Contents/MacOS/*; do
            echo "dependencies of $bin"
            otool -L "$bin"
            ! otool -L "$bin" | grep -q "/nix/store/"
          done
          ! otool -l "$APP"/Contents/MacOS/hulahoop-desktop | grep -A2 LC_RPATH | grep -q "/nix/store/"
      - name: verify signature
        run: |
          APP=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Hulahoop.app
          # Every executable in Contents/MacOS must be signed: on arm64 the kernel
          # refuses to launch an unsigned binary, and that includes the two sidecars.
          for bin in "$APP"/Contents/MacOS/*; do
            echo "verifying $bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
          codesign -dvv "$APP" 2>&1 | tee /tmp/codesign.txt
          grep -q "Signature=adhoc" /tmp/codesign.txt
      # The host that runs the agents needs the same binaries without an .app
      # around them, so it does not need a checkout to get started.
      - name: pack the headless binaries
        run: |
          mkdir -p dist
          tar -czf "dist/hulahoop-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" hulahoop-server hulahoop-runner hulahoop
          tar -tzf "dist/hulahoop-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            dist/*.tar.gz

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # upload-artifact keeps the paths it was given, and with two of them the
          # least common ancestor is the repository root, so the files land deep.
          mkdir -p release
          find artifacts -name '*.dmg' -exec cp {} release/ \;
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          ls -l release
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "Requires macOS 14 (Sonoma) or newer on Apple silicon; the build is unsigned, so right-click the app and choose Open. The hulahoop-<target>.tar.gz asset holds hulahoop-server, hulahoop-runner and the hulahoop CLI: unpack it on the machine with the repos and the toolchain, then run hulahoop up --listen 0.0.0.0 --port 5123 there." \
            release/*
