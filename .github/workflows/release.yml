name: release

on:
  push:
    tags: ["v*"]

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel needs an x86_64 runner GitHub no longer offers by default; add a
          # `macos-26-intel` (or a paid larger runner) leg here when it matters, and
          # keep the artifact name distinct.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.0
      - name: bundle
        run: nix develop --command just bundle ${{ matrix.target }}
      # arm64 refuses to execute an unsigned binary at all, so an ad-hoc signature is
      # mandatory. Verify the executable (what the kernel checks on launch) and assert
      # the signature really is ad-hoc: `--verify --deep` on the whole bundle reports
      # "code has no resources but signature indicates they must be present" for an
      # ad-hoc signed .app, which is a codesign quirk, not a bundling defect.
      - name: verify signature
        run: |
          APP=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Hulahoop.app
          codesign --verify --strict --verbose=2 "$APP/Contents/MacOS/Hulahoop"
          codesign -dvv "$APP" 2>&1 | tee /tmp/codesign.txt
          grep -q "Signature=adhoc" /tmp/codesign.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Unsigned build: right-click the app, choose Open, then confirm. On Apple silicon, arm64 requires at least an ad-hoc signature, which this build carries." artifacts/**/*.dmg
