name: release

on:
  push:
    tags: ["v*"]

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel needs an x86_64 runner GitHub no longer offers by default; add a
          # `macos-26-intel` (or a paid larger runner) leg here when it matters, and
          # keep the artifact name distinct.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.1
      - name: bundle
        run: nix develop --command just bundle ${{ matrix.target }}
      - name: verify signature
        run: |
          APP=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Hulahoop.app
          codesign --verify --deep --strict "$APP"
          echo "ad-hoc signed: $APP"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Unsigned build: right-click the app, choose Open, then confirm. On Apple silicon, arm64 requires at least an ad-hoc signature, which this build carries." artifacts/**/*.dmg
