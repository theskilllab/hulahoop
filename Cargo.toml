[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/server",
    "crates/runner",
    "crates/cli",
]

# The Tauri shell is its own build because it links the platform webview; keeping it
# out of the workspace keeps `cargo test` from needing a GUI toolchain.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/theskilllab/hulahoop"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
async-graphql = { version = "7", features = ["chrono", "uuid"] }
async-graphql-axum = "7"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
hulahoop-core = { path = "crates/core" }
libc = "0.2"
nix = { version = "0.30", features = ["signal", "process"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
